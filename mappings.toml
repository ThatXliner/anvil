[[endpoints]]
source = "GET /search/repositories"
target = "GET /repos/search"
note = "Forgejo's repo search lives at /repos/search, not /search/repositories -- no path/operationId match, mapped by hand. Query syntax differs: GitHub's `q` supports qualifiers like `language:` / `stars:>N` inline in the string; Forgejo takes separate `q`, `topic`, `language` etc. params. Simple keyword searches work; GitHub qualifier syntax does not translate and is passed through as a literal (mostly useless) string. Forgejo wraps results as {data, ok}; GitHub wraps as {items, total_count, incomplete_results} -- `items` is aliased to `data`, but `total_count`/`incomplete_results` are Forgejo's X-Total-Count header, not body fields, so they're defaulted rather than accurately populated."
edited = true

